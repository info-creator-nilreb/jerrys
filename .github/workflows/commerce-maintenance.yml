# Epic 1: Reservierungs-Ablauf + Outbox (alle 30 Min.) — sinnvoll bei Hobby-Plan,
# weil Vercel Cron dort max. 1×/Tag erlaubt (vercel.json nutzt 1×/Tag als Fallback).
#
# GitHub Repo → Settings → Secrets → Actions:
#   COMMERCE_MAINTENANCE_SITE_URL  z. B. https://deine-domain.vercel.app (ohne Slash am Ende)
#   COMMERCE_MAINTENANCE_SECRET    gleicher Wert wie in Vercel

name: Commerce maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: commerce-maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST maintenance
        env:
          SITE_URL: ${{ secrets.COMMERCE_MAINTENANCE_SITE_URL }}
          SECRET: ${{ secrets.COMMERCE_MAINTENANCE_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$SECRET" ]; then
            echo "COMMERCE_MAINTENANCE_SITE_URL oder COMMERCE_MAINTENANCE_SECRET fehlt — Job übersprungen."
            exit 0
          fi
          curl -fsS -X POST "${SITE_URL%/}/api/internal/commerce-maintenance" \
            -H "Authorization: Bearer ${SECRET}"
