# Wendet Prisma-Migrationen auf alle konfigurierten Shop-Datenbanken an (Push auf main
# bei Schema-Änderungen oder manuell). Pro Shop ein GitHub Secret mit Direct-/Session-URL
# (Port 5432) — siehe docs/OPERATIONS.md#migrationen-automatisch-mehrere-shops.
name: DB migrate deploy

on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
  workflow_dispatch:

concurrency:
  group: db-migrate-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-jerrys:
    name: migrate (jerry's Production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRISMA_MIGRATE_DATABASE_URL: ${{ secrets.PRISMA_MIGRATE_DATABASE_URL_JERRYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Secret gesetzt?
        id: cfg
        run: |
          if [ -z "$PRISMA_MIGRATE_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migration übersprungen::Secret PRISMA_MIGRATE_DATABASE_URL_JERRYS fehlt."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Migration status
        if: steps.cfg.outputs.configured == 'true'
        run: npx prisma migrate status
      - name: Apply migrations
        if: steps.cfg.outputs.configured == 'true'
        run: npx prisma migrate deploy

  migrate-edelweiss:
    name: migrate (Edelweiss Production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRISMA_MIGRATE_DATABASE_URL: ${{ secrets.PRISMA_MIGRATE_DATABASE_URL_EDELWEISS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Secret gesetzt?
        id: cfg
        run: |
          if [ -z "$PRISMA_MIGRATE_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migration übersprungen::Secret PRISMA_MIGRATE_DATABASE_URL_EDELWEISS fehlt."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Migration status
        if: steps.cfg.outputs.configured == 'true'
        run: npx prisma migrate status
      - name: Apply migrations
        if: steps.cfg.outputs.configured == 'true'
        run: npx prisma migrate deploy
